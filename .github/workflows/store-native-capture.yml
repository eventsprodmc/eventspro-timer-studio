name: Capture actual Timer PRO Windows window
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Ephemeral hosted Windows runner
        type: choice
        options:
          - windows-2022
          - windows-2025
        default: windows-2022
permissions:
  contents: read
jobs:
  native-window:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Store candidate and parse PowerShell
        shell: pwsh
        run: |
          $expected='4e5c0de235a1ed7ca027c9e3988927741e9bcb91f09a7f2ff2adec38cb3ace6c'
          $actual=(Get-FileHash 'store-test-inputs/Timer-PRO-Windows-1.0.0.0.msix' -Algorithm SHA256).Hash.ToLower()
          if($actual -ne $expected){throw 'Store MSIX hash mismatch'}
          foreach($file in @('scripts/Capture-Native-Timer.ps1','scripts/Prepare-Native-Desktop.ps1')){
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){throw ($errors|Out-String)}
          }
      - name: Check Microsoft WebView2 availability
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Find-WebView2 {
            $locations=@("${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application","$env:ProgramFiles/Microsoft/EdgeWebView/Application","$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application")
            foreach($folder in $locations){if(Test-Path $folder){$runtime=Get-ChildItem $folder -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue|Select-Object -First 1;if($runtime){return $runtime.FullName}}}
          }
          $runtime=Find-WebView2
          if(-not $runtime){
            # Only on this disposable CI runner; official signed Microsoft Evergreen bootstrapper.
            $installer=Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature=Get-AuthenticodeSignature $installer
            if($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation'){throw 'Microsoft installer signature verification failed'}
            $proc=Start-Process $installer -ArgumentList '/silent','/install' -Wait -PassThru
            if($proc.ExitCode -ne 0){throw "Microsoft WebView2 setup failed: $($proc.ExitCode)"}
            $runtime=Find-WebView2
            if(-not $runtime){throw 'WebView2 not found after official setup'}
          }
          Write-Host "Using Microsoft WebView2: $runtime"
      - name: Prepare actual Windows desktop
        shell: pwsh
        run: ./scripts/Prepare-Native-Desktop.ps1
      - name: Run native Timer and capture its real window
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path evidence|Out-Null
          & ./scripts/Capture-Native-Timer.ps1 -PackagePath store-test-inputs/Timer-PRO-Windows-1.0.0.0.msix -OutputDirectory evidence/native *>&1 | Tee-Object evidence/native-capture.log
          if($LASTEXITCODE -and $LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Retain only screenshots and factual receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Timer-PRO-native-Windows-${{ inputs.runner }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            evidence/native/*.png
            evidence/native/*.json
            evidence/*.log
